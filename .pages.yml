media:
  input: media
  output: /media
content:
  - name: writing
    label: Writing
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Short description (optional)
        type: string
      - name: topic
        label: Topic (optional)
        type: string
      - name: layout
        type: string
        default: post
        hidden: true
      - name: body
        label: Your writing
        type: rich-text
  - name: homepage
    label: Homepage text
    type: file
    path: _data/home.yml
    fields:
      - name: heading
        label: Heading
        type: string
      - name: subtitle
        label: Subtitle
        type: string
