media:
  input: media
  output: /media
content:
  - name: writing
    label: Writing
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Short description (optional)
        type: string
      - name: topic
        label: Topic (optional)
        type: string
      - name: layout
        type: string
        default: post
        hidden: true
      - name: body
        label: Your writing
        type: rich-text
      - name: annotations
        label: Author notes (shown beside passages)
        description: Add a note by copying a short, unique sentence or phrase from the essay and writing your comment. Notes show as small clickable markers beside the matching paragraph.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{quote}"
        fields:
          - name: quote
            label: Exact quote from your essay
            description: Paste a short unique fragment from one paragraph. Match the published words exactly.
            type: text
            required: true
          - name: note
            label: Your note
            type: text
            required: true
  - name: homepage
    label: Homepage text
    type: file
    path: _data/home.yml
    fields:
      - name: heading
        label: Heading
        type: string
      - name: subtitle
        label: Subtitle
        type: string
