---
layout: default
---
<section class="writing"><h1>Writing</h1>
{% for post in site.posts %}<a class="post" href="{{ post.url | relative_url }}"><span><strong>{{ post.title | escape }}</strong>{% if post.description %}<small>{{ post.description | escape }}</small>{% endif %}</span><span class="post-date">{{ post.date | date: "%b %-d, %Y" }}</span></a>{% endfor %}</section>
