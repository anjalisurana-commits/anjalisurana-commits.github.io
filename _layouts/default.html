<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% if page.title %}{{ page.title | escape }} · {% endif %}Anjali Surana</title><link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v=4"><script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.dataset.theme='dark'}catch(e){}})();</script></head>
<body><div class="theme-bar"><button id="theme-toggle" type="button" aria-label="Switch to dark mode">Dark mode</button></div><main>{{ content }}</main><script>(function(){var b=document.getElementById('theme-toggle');function render(){var d=document.documentElement.dataset.theme==='dark';b.textContent=d?'Light mode':'Dark mode';b.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode')}b.addEventListener('click',function(){var d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'light':'dark';try{localStorage.setItem('theme',d?'light':'dark')}catch(e){}render()});render()})();</script></body></html>
